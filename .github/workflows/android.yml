name: Android APK

on:
  push:
    branches: [main, android-ui-runtime-pending-xml]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WORK: ${{ github.workspace }}/.android-work
      APP_ID: com.daedalus.uncharted
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      KEYSTORE_PASS: pass:android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Validate signature patch safety
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/test_guest_fix_patterns.c src/runtime_guest_fixes.c -o "$RUNNER_TEMP/guest-pattern-tests"
          "$RUNNER_TEMP/guest-pattern-tests"
          g++ -std=c++20 -Wall -Wextra -Werror -I. tests/test_ui_composition.cpp -o "$RUNNER_TEMP/ui-composition-test"
          "$RUNNER_TEMP/ui-composition-test"
      - name: Install native build tools and SDK
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build python3-venv bison flex pkg-config curl zip binutils glslang-tools
          sdkmanager 'ndk;30.0.16248370' 'build-tools;35.0.1' 'platforms;android-35'
          echo "NDK=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KEYSTORE=$RUNNER_TEMP/uncharted-development.p12" >> "$GITHUB_ENV"
      - name: Restore pinned dependency builds
        id: native-cache
        uses: actions/cache@v4
        with:
          path: .android-work
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('android/scripts/build_all.sh', 'android/scripts/port-arm64/**', '.gitmodules') }}
          restore-keys: |
            android-native-v1-${{ runner.os }}-
      - name: Prepare development signing key
        shell: bash
        run: base64 --decode .github/android/development-key.base64 > "$KEYSTORE"
      - name: Build Uncharted Android
        shell: bash
        run: |
          mkdir -p "$WORK"
          set -o pipefail
          bash android/scripts/build_all.sh 2>&1 | tee "$WORK/build.log"
      - name: Verify Android touch controls and menu
        shell: bash
        run: |
          g++ -std=c++20 -O0 -Igpu/third_party/imgui -I"$WORK/deps/src/sdl3/include" -Igpu/shim -Igpu/shadps4 \
            tests/test_android_touch_menu.cpp gpu/shim/bbport_touchpad.cpp gpu/shim/bbport_overlay_android.cpp gpu/shim/bbport_settings.cpp \
            gpu/third_party/imgui/{imgui,imgui_draw,imgui_widgets,imgui_tables}.cpp -o "$RUNNER_TEMP/touch-menu-test"
          BB_CONFIG="$RUNNER_TEMP/touch-test.ini" "$RUNNER_TEMP/touch-menu-test"
      - name: Verify APK and record source revision
        shell: bash
        run: |
          mkdir -p dist
          apk="$WORK/apk/uncharted-android.apk"
          "$SDK/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$SDK/build-tools/35.0.1/aapt2" dump badging "$apk" > dist/package.txt
          grep -q "package: name='com.daedalus.uncharted'" dist/package.txt
          grep -q "native-code: 'arm64-v8a'" dist/package.txt
          cp "$apk" dist/Uncharted-Daedalus-0.2.8.apk
          git rev-parse HEAD > dist/source-commit.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-Daedalus-0.2.8
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          include-hidden-files: true
          path: |
            .android-work/*.log
            .android-work/deps/build/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep completed dependency builds after compilation failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-work
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('android/scripts/build_all.sh', 'android/scripts/port-arm64/**', '.gitmodules') }}

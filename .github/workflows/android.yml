name: Android APK

on:
  push:
    branches: [main, android-ui-runtime-pending-xml, integrate/redvortex-release025, fix/uncharted2-crash, improve/u2-performance-install, integrate/six-renderer-options]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WORK: ${{ github.workspace }}/.android-work
      APP_ID: com.daedalus.uncharted
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      KEYSTORE_PASS: pass:android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Validate signature patch safety
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/test_guest_fix_patterns.c src/runtime_guest_fixes.c -o "$RUNNER_TEMP/guest-pattern-tests"
          "$RUNNER_TEMP/guest-pattern-tests"
          g++ -std=c++20 -Wall -Wextra -Werror -I. tests/test_ui_composition.cpp -o "$RUNNER_TEMP/ui-composition-test"
          "$RUNNER_TEMP/ui-composition-test"
      - name: Verify release base and optional optimization controls
        run: |
          python3 tests/test_release025_base.py
          javac -d "$RUNNER_TEMP/compat-test" android/scripts/g2/game_app/ArmCompatibility.java tests/TestArmCompatibility.java
          java -cp "$RUNNER_TEMP/compat-test" dev.unchartedg2.game.TestArmCompatibility
          cc -std=c11 -Wall -Wextra -Werror -O2 -pthread tests/test_uncharted_jobspin.c -o "$RUNNER_TEMP/jobspin-test"
          "$RUNNER_TEMP/jobspin-test"
          g++ -std=c++20 -Wall -Wextra -Werror -Igpu/shim tests/test_readback_policy.cpp -o "$RUNNER_TEMP/batch-test"
          "$RUNNER_TEMP/batch-test"
      - name: Verify renderer comparison and speculative shader safety
        run: |
          python3 tests/test_renderer_options.py
          python3 tests/test_srt_speculative.py
          python3 tests/test_speculative_fault_dispatch.py
          python3 tests/test_shader_selection_recovery.py
          python3 tests/test_fsr_native_aa_policy.py
          python3 tests/test_u3_skip_logos.py
          python3 tests/test_u3_patch_install.py
          python3 tests/test_u3_resolution_dimensions.py
          c++ -std=c++20 -Wall -Wextra -Werror -Igpu/shim tests/test_readback_cpu_ownership.cpp -o "$RUNNER_TEMP/readback-ownership"
          "$RUNNER_TEMP/readback-ownership"
          python3 tests/test_readback_cpu_ownership.py
          javac -d "$RUNNER_TEMP/renderer-test" android/scripts/g2/game_app/ArmCompatibility.java android/scripts/g2/game_app/RendererOptions.java tests/TestRendererOptions.java
          java -cp "$RUNNER_TEMP/renderer-test" dev.unchartedg2.game.TestRendererOptions
      - name: Verify live crash register capture
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/test_guest_fault_arm64.c -o "$RUNNER_TEMP/guest-fault-test"
          "$RUNNER_TEMP/guest-fault-test"
      - name: Verify protected file reads and mesh results
        run: |
          python3 tests/test_landing_order.py
          python3 tests/test_pkg_descriptor.py
          javac -d "$RUNNER_TEMP/setup-test" android/scripts/g2/game_app/SetupFlow.java tests/TestSetupFlow.java
          java -cp "$RUNNER_TEMP/setup-test" dev.unchartedg2.game.TestSetupFlow
          javac -d "$RUNNER_TEMP/storage-test" android/scripts/g2/game_app/StoragePaths.java tests/TestStoragePaths.java
          java -cp "$RUNNER_TEMP/storage-test" dev.unchartedg2.game.TestStoragePaths
          g++ -std=c++20 -Wall -Wextra -Werror -Igpu/shim tests/test_staging_reuse.cpp -o "$RUNNER_TEMP/staging-test"
          "$RUNNER_TEMP/staging-test"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tests/test_file_protected_read.c -pthread -o "$RUNNER_TEMP/protected-read-test"
          "$RUNNER_TEMP/protected-read-test"
          cc -std=c11 -O2 -Isrc tests/test_file_mods.c -pthread -o "$RUNNER_TEMP/file-mods-test"
          "$RUNNER_TEMP/file-mods-test"
          g++ -std=c++20 -Wall -Wextra -Werror -Igpu/shim tests/test_mesh_copy_policy.cpp -o "$RUNNER_TEMP/mesh-copy-test"
          "$RUNNER_TEMP/mesh-copy-test"
      - name: Install native build tools and SDK
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build python3-venv bison flex pkg-config curl zip binutils glslang-tools
          sdkmanager 'ndk;30.0.16248370' 'build-tools;35.0.1' 'platforms;android-35'
          echo "NDK=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KEYSTORE=$RUNNER_TEMP/uncharted-development.p12" >> "$GITHUB_ENV"
      - name: Restore pinned dependency builds
        id: native-cache
        uses: actions/cache@v4
        with:
          path: .android-work
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('android/scripts/build_all.sh', 'android/scripts/port-arm64/**', '.gitmodules') }}
          restore-keys: |
            android-native-v1-${{ runner.os }}-
      - name: Prepare development signing key
        shell: bash
        run: base64 --decode .github/android/development-key.base64 > "$KEYSTORE"
      - name: Build Uncharted Android
        shell: bash
        run: |
          mkdir -p "$WORK"
          set -o pipefail
          bash android/scripts/build_all.sh 2>&1 | tee "$WORK/build.log"
      - name: Verify shared translations and FSR preset mapping
        shell: bash
        run: |
          python3 android/localization/generate.py
          git diff --exit-code -- gpu/shim/bbport_locale.h
          javac -d "$RUNNER_TEMP/preset-test" android/scripts/g2/game_app/UpscalePreset.java tests/TestUpscalePreset.java android/scripts/g2/game_app/GameLanguage.java tests/TestGameLanguage.java
          java -cp "$RUNNER_TEMP/preset-test" dev.unchartedg2.game.TestUpscalePreset
          java -cp "$RUNNER_TEMP/preset-test" dev.unchartedg2.game.TestGameLanguage
          g++ -std=c++20 -Igpu/shim tests/test_android_touch_layout.cpp -o "$RUNNER_TEMP/touch-layout-test"
          "$RUNNER_TEMP/touch-layout-test"
          g++ -std=c++20 -D__ANDROID__ -Igpu/shim -Igpu/shadps4 tests/test_android_ui_settings.cpp gpu/shim/bbport_settings.cpp -o "$RUNNER_TEMP/ui-settings-test"
          BB_CONFIG="$RUNNER_TEMP/ui-settings.ini" "$RUNNER_TEMP/ui-settings-test"
      - name: Verify mobile memory and frame pacing policies
        shell: bash
        run: |
          g++ -std=c++20 -Igpu/shim tests/test_android_mobile_policy.cpp -o "$RUNNER_TEMP/mobile-policy-test"
          "$RUNNER_TEMP/mobile-policy-test"
          g++ -std=c++20 -Igpu/shim tests/test_android_fps_meter.cpp -o "$RUNNER_TEMP/fps-meter-test"
          "$RUNNER_TEMP/fps-meter-test"
          g++ -std=c++20 -O0 -Igpu/shim -Igpu/third_party/imgui tests/test_android_hud_text.cpp gpu/third_party/imgui/{imgui,imgui_draw,imgui_widgets,imgui_tables}.cpp -o "$RUNNER_TEMP/hud-text-test"
          "$RUNNER_TEMP/hud-text-test"
      - name: Verify Android touch controls and menu
        shell: bash
        run: |
          g++ -std=c++20 -O0 -Igpu/third_party/imgui -I"$WORK/deps/src/sdl3/include" -Igpu/shim -Igpu/shadps4 \
            tests/test_android_touch_menu.cpp gpu/shim/bbport_touchpad.cpp gpu/shim/bbport_overlay_android.cpp gpu/shim/bbport_settings.cpp \
            gpu/third_party/imgui/{imgui,imgui_draw,imgui_widgets,imgui_tables}.cpp -o "$RUNNER_TEMP/touch-menu-test"
          BB_CONFIG="$RUNNER_TEMP/touch-test.ini" "$RUNNER_TEMP/touch-menu-test"
      - name: Verify APK and record source revision
        shell: bash
        run: |
          mkdir -p dist
          apk="$WORK/apk/uncharted-android.apk"
          "$SDK/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$SDK/build-tools/35.0.1/aapt2" dump badging "$apk" > dist/package.txt
          "$SDK/build-tools/35.0.1/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > dist/manifest.txt
          grep -q "appCategory" dist/manifest.txt
          grep -q "isGame" dist/manifest.txt
          grep -q "android.game_mode_config" dist/manifest.txt
          grep -q "package: name='com.daedalus.uncharted'" dist/package.txt
          grep -q "application-label:'Uncharted Daedalus'" dist/package.txt
          grep -q "versionName='0.2.5'" dist/package.txt
          grep -q "versionCode='100205'" dist/package.txt
          grep -q "targetSdkVersion:'28'" dist/package.txt
          grep -q "uses-permission: name='android.permission.WRITE_EXTERNAL_STORAGE'" dist/package.txt
          grep -q "native-code: 'arm64-v8a'" dist/package.txt
          cp "$apk" dist/Uncharted-Daedalus-0.2.5-Stability-U3Fixes.apk
          git rev-parse HEAD > dist/source-commit.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Uncharted-Daedalus-0.2.5-Stability-U3Fixes
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload compilation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          include-hidden-files: true
          path: |
            .android-work/*.log
            .android-work/deps/build/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep completed dependency builds after compilation failure
        if: failure() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-work
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('android/scripts/build_all.sh', 'android/scripts/port-arm64/**', '.gitmodules') }}
